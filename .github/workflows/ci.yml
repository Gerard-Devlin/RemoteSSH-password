name: Platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            native/go.sum
            native/testserver/go.sum
      - run: npm ci
      - name: Validate PowerShell release tooling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('./scripts/release-from-ci.ps1','./scripts/verify-ci-artifact.ps1','./scripts/verify-package.ps1')) {
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw ('PowerShell parse failed: '+$file)
            }
          }
      - name: Formatting, compile, unit, localization, and documentation checks
        run: npm run check
      - name: Native static analysis
        working-directory: native
        run: go vet ./...
      - name: Check loopback test compatibility
        id: ssh
        run: node scripts/ci-compatibility.mjs
      - name: Real OpenSSH loopback integration
        if: steps.ssh.outputs.supported == 'true'
        run: npm run test:integration
      - name: English and Chinese extension-entry integration (mocked VS Code API)
        if: steps.ssh.outputs.supported == 'true'
        run: npm run test:extension
      - name: Record unavailable integration coverage
        if: steps.ssh.outputs.supported != 'true'
        run: echo 'NOT RUN - the system OpenSSH build is unsupported. See the job summary.'
      - name: Build platform package
        run: npm run package -- --target ${{ matrix.target }}
      - name: Verify package and write distribution receipt
        run: node scripts/verify-package.mjs --target ${{ matrix.target }} --commit ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: remote-ssh-password-memory-${{ matrix.target }}
          path: |
            artifacts/*.vsix
            artifacts/package-verification-*.json
            artifacts/SHA256SUMS-*.txt
            artifacts/integration-results.json
            artifacts/extension-results-en.json
            artifacts/extension-results-zh-cn.json
          if-no-files-found: error
          retention-days: 14
