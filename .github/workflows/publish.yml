name: Release and Marketplace

on:
  workflow_run:
    workflows: ['Windows checks']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: distribution-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      publishable: ${{ steps.release.outputs.publishable }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: remote-ssh-password-memory-win32-x64
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify and create an immutable preview Release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: ./scripts/release-from-ci.ps1 -ArtifactDirectory artifacts -ExpectedCommit $env:RELEASE_COMMIT
      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.publishable == 'true'
        with:
          name: marketplace-upload
          path: ${{ steps.release.outputs.upload_directory }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Record the Marketplace setup status
        if: steps.release.outputs.publishable == 'true' && vars.MARKETPLACE_PUBLISH_ENABLED != 'true'
        shell: pwsh
        run: |
          '### Marketplace publishing is not enabled' >> $env:GITHUB_STEP_SUMMARY
          'The verified GitHub Release is ready. Configure publisher Devlin → Trusted Publishing for publish.yml, then set the repository variable MARKETPLACE_PUBLISH_ENABLED to true and rerun Windows checks.' >> $env:GITHUB_STEP_SUMMARY

  marketplace:
    needs: release
    if: needs.release.outputs.publishable == 'true' && vars.MARKETPLACE_PUBLISH_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: marketplace-upload
          path: artifacts
      - name: Publish the verified package with OIDC
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          $artifact = ./scripts/verify-ci-artifact.ps1 -ArtifactDirectory artifacts -ExpectedCommit $env:RELEASE_COMMIT | ConvertFrom-Json
          & node node_modules/@vscode/vsce/vsce publish --oidc --packagePath $artifact.package --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'Marketplace publishing failed. Check the Devlin Trusted Publishing policy for this repository and publish.yml.' }
          '### Marketplace publish step completed' >> $env:GITHUB_STEP_SUMMARY
          'Publisher: Devlin. Existing versions are never overwritten. Check https://marketplace.visualstudio.com/items?itemName=Devlin.remote-ssh-password-memory for platform validation and availability.' >> $env:GITHUB_STEP_SUMMARY
