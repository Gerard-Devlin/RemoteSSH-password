name: Release and Marketplace

on:
  workflow_run:
    workflows: ['Platform checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_channel:
        description: Release channel
        required: true
        type: choice
        options: [stable, preview]
        default: stable
      source_run_id:
        description: Successful Platform checks run ID for this commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: distribution-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      publishable: ${{ steps.release.outputs.publishable }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify manually selected Platform checks run
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if ($env:SOURCE_RUN_ID -notmatch '^\d+$') { throw 'A numeric Platform checks run ID is required' }
          $run = gh api ('repos/'+$env:GITHUB_REPOSITORY+'/actions/runs/'+$env:SOURCE_RUN_ID) | ConvertFrom-Json
          if ($run.name -cne 'Platform checks' -or $run.event -cne 'push' -or $run.head_branch -cne 'main' -or $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.head_sha -ine $env:EXPECTED_COMMIT) {
            throw 'The selected run is not a successful main-branch Platform checks run for this commit'
          }
      - uses: actions/download-artifact@v7
        with:
          pattern: remote-ssh-password-memory-*
          merge-multiple: true
          path: artifacts
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and create a GitHub Release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_CHANNEL: ${{ inputs.release_channel || 'preview' }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, inputs.source_run_id) }}
        run: |
          foreach ($target in @('win32-x64','darwin-arm64','darwin-x64')) {
            ./scripts/release-from-ci.ps1 -ArtifactDirectory artifacts -ExpectedCommit $env:RELEASE_COMMIT -Target $target -Channel $env:RELEASE_CHANNEL
          }
      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.publishable == 'true'
        with:
          name: marketplace-upload
          path: ${{ steps.release.outputs.upload_directory }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Record the Marketplace setup status
        if: steps.release.outputs.publishable == 'true' && vars.MARKETPLACE_PUBLISH_ENABLED != 'true'
        shell: pwsh
        run: |
          '### Marketplace publishing is not enabled' >> $env:GITHUB_STEP_SUMMARY
          'The verified GitHub Release is ready. Configure publisher Devlin → Trusted Publishing for publish.yml, then set the repository variable MARKETPLACE_PUBLISH_ENABLED to true and rerun Platform checks.' >> $env:GITHUB_STEP_SUMMARY

  marketplace:
    needs: release
    if: needs.release.outputs.publishable == 'true' && vars.MARKETPLACE_PUBLISH_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: marketplace-upload
          path: artifacts
      - name: Publish the verified package with OIDC
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          foreach ($target in @('win32-x64','darwin-arm64','darwin-x64')) {
            $artifact = ./scripts/verify-ci-artifact.ps1 -ArtifactDirectory artifacts -ExpectedCommit $env:RELEASE_COMMIT -Target $target | ConvertFrom-Json
            & node node_modules/@vscode/vsce/vsce publish --oidc --packagePath $artifact.package --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw ('Marketplace upload failed for '+$target) }
          }
          '### Marketplace publish step completed' >> $env:GITHUB_STEP_SUMMARY
          'Publisher: Devlin. Existing versions are never overwritten. Check https://marketplace.visualstudio.com/items?itemName=Devlin.remote-ssh-password-memory for platform validation and availability.' >> $env:GITHUB_STEP_SUMMARY
