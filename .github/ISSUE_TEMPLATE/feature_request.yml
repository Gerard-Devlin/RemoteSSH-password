name: Feature request
description: Describe a use case and the behavior you would like.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What task is difficult in the current extension?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected workflow, including platform and display language if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
